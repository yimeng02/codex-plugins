interface:
  display_name: "禅道成员操作"
  short_description: "按成员权限安全操作禅道，写入后展示真实界面截图"
  default_prompt: "使用 $zentao-member-ops 配置并操作禅道；首次配置先向我收集地址、账号、密码和项目范围，写入经确认执行后展示真实禅道结果截图。"

dependencies:
  tools:
    - type: "mcp"
      value: "zentao-member-ops"
      description: "按禅道成员分组实时生成项目、Bug、需求、任务和安全写入工具"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
