interface:
  display_name: "禅道成员操作"
  short_description: "支持多身份切换，按成员权限安全操作禅道"
  default_prompt: "使用 $zentao-member-ops 配置并操作禅道；支持查看、新增和切换多个连接身份，切换后提醒我重启并核对身份，写入经确认执行后展示真实禅道结果截图。"

dependencies:
  tools:
    - type: "mcp"
      value: "zentao-member-ops"
      description: "按禅道成员分组实时生成项目、Bug、需求、任务和安全写入工具"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
